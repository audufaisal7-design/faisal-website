<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FAISAL CITY — Open World</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  user-select:none;
  touch-action:none;
}
canvas{display:block}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  z-index:10;
  color:white;
  font-size:14px;
  text-shadow:0 2px 3px #000;
  pointer-events:none;
}

.panel{
  background:rgba(0,0,0,.58);
  border:1px solid rgba(255,255,255,.2);
  border-radius:10px;
  padding:9px 12px;
  margin-bottom:6px;
}

#mission{
  max-width:290px;
}

#speed{
  font-size:20px;
  font-weight:bold;
}

#wanted{
  color:#ffd83d;
}

#message{
  position:fixed;
  top:15%;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  color:white;
  background:rgba(0,0,0,.75);
  padding:12px 20px;
  border-radius:10px;
  display:none;
  text-align:center;
}

#dealer{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(90%,390px);
  max-height:85vh;
  overflow:auto;
  background:rgba(10,15,22,.96);
  color:white;
  border:1px solid #777;
  border-radius:15px;
  padding:18px;
  z-index:30;
  display:none;
}

#dealer h2{margin-top:0}

.vehicle{
  padding:12px;
  margin:8px 0;
  border:1px solid #555;
  border-radius:10px;
  background:#18202a;
}

.vehicle button,
#closeDealer{
  border:0;
  border-radius:8px;
  padding:9px 12px;
  margin-top:6px;
  font-weight:bold;
}

.vehicle button{
  background:#42d66b;
  color:#07130a;
}

#closeDealer{
  background:#d94a4a;
  color:white;
  width:100%;
}

#controls{
  position:fixed;
  left:15px;
  bottom:15px;
  z-index:20;
}

.row{
  display:flex;
  justify-content:center;
}

.ctrl{
  width:58px;
  height:58px;
  margin:4px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:14px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:22px;
  font-weight:bold;
}

#actions{
  position:fixed;
  right:12px;
  bottom:15px;
  z-index:20;
  display:grid;
  grid-template-columns:repeat(2,68px);
}

.action{
  width:62px;
  height:62px;
  margin:4px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.58);
  color:white;
  font-size:12px;
  font-weight:bold;
}

#mini{
  position:fixed;
  right:12px;
  top:12px;
  width:130px;
  height:130px;
  background:rgba(0,0,0,.55);
  border:2px solid rgba(255,255,255,.5);
  border-radius:10px;
  z-index:15;
}

#save{
  position:fixed;
  right:155px;
  top:12px;
  z-index:20
  background:rgba(0,0,0,.6);
  color:white;
  border:1px solid #777;
  padding:8px;
  border-radius:8px;
}

@media(max-width:600px){
  #hud{font-size:12px}
  .panel{padding:6px 8px}
  #mini{width:105px;height:105px}
  #save{right:125px}
}
</style>
</head>

<body>

<div id="hud">
  <div class="panel">
    <div><b>FAISAL CITY</b></div>
    <div>💰 Cash: ₵<span id="cash">5000</span></div>
    <div>❤️ Health: <span id="health">100</span></div>
    <div>⚡ Energy: <span id="energy">100</span></div>
    <div>⭐ Wanted: <span id="wanted">0</span></div>
    <div>🏆 Reputation: <span id="rep">0</span></div>
    <div id="vehicle">🚶 On Foot</div>
    <div id="speed">0 km/h</div>
    <div>⛽ Fuel: <span id="fuel">100</span>%</div>
    <div>🕐 <span id="clock">08:00</span></div>
  </div>

  <div class="panel" id="mission">
    🎯 Mission:<br>
    <span id="missionText">Explore Faisal City</span>
  </div>
</div>

<button id="save" onclick="saveGame()">SAVE</button>

<div id="message"></div>

<div id="dealer">
  <h2>🏎️ FAISAL MOTORS</h2>
  <p>Choose your vehicle.</p>
  <div id="vehicleList"></div>
  <button id="closeDealer" onclick="closeDealer()">CLOSE</button>
</div>

<canvas id="mini"></canvas>

<div id="controls">
  <div class="row">
    <button class="ctrl" id="up">▲</button>
  </div>

  <div class="row">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="down">▼</button>
    <button class="ctrl" id="right">▶</button>
  </div>
</div>

<div id="actions">
  <button class="action" id="enter">ENTER</button>
  <button class="action" id="action">ACTION</button>
  <button class="action" id="brake">BRAKE</button>
  <button class="action" id="horn">HORN</button>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x88b8dc);

scene.fog = new THREE.Fog(
  0x88b8dc,
  180,
  850
);

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  0.1,
  1500
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

document.body.appendChild(
  renderer.domElement
);


/* LIGHTING */

const hemi =
  new THREE.HemisphereLight(
    0xb9ddff,
    0x39402d,
    1.8
  );

scene.add(hemi);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    2.2
  );

sun.position.set(
  180,
  350,
  100
);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

scene.add(sun);


/* WORLD */

const WORLD=900;

const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      WORLD,
      WORLD
    ),
    new THREE.MeshStandardMaterial({
      color:0x3e663c,
      roughness:1
    })
  );

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* MATERIALS */

const roadMat =
  new THREE.MeshStandardMaterial({
    color:0x25272a,
    roughness:1
  });

const lineMat =
  new THREE.MeshBasicMaterial({
    color:0xf3d65a
  });


/* ROADS */

function road(x,z,w,d){

  const r =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,.08,d
      ),
      roadMat
    );

  r.position.set(
    x,.04,z
  );

  r.receiveShadow=true;

  scene.add(r);

  if(w>d){

    for(
      let i=x-w/2+15;
      i<x+w/2;
      i+=25
    ){

      const line =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            12,.09,.35
          ),
          lineMat
        );

      line.position.set(
        i,.1,z
      );

      scene.add(line);
    }

  }else{

    for(
      let i=z-d/2+15;
      i<z+d/2;
      i+=25
    ){

      const line =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .35,.09,12
          ),
          lineMat
        );

      line.position.set(
        x,.1,i
      );

      scene.add(line);
    }
  }
}

road(0,0,900,32);
road(0,0,32,900);
road(0,220,900,28);
road(0,-220,900,28);
road(220,0,28,900);
road(-220,0,28,900);


/* BUILDINGS */

const buildings=[];

function makeBuilding(
  x,z,w,d,h
){

  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      new THREE.MeshStandardMaterial({
        color:new THREE.Color()
          .setHSL(
            Math.random(),
            .12,
            .30+
            .2*Math.random()
          ),
        roughness:.9
      })
    );

  body.position.set(
    x,h/2,z
  );

  body.castShadow=true;
  body.receiveShadow=true;

  scene.add(body);

  buildings.push({
    x:x,
    z:z,
    w:w,
    d:d
  });

  for(
    let y=4;
    y<h-2;
    y+=5
  ){

    for(
      let xx=-w/2+3;
      xx<w/2-2;
      xx+=5
    ){

      const win =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            1.8,.9,.08
          ),
          new THREE.MeshBasicMaterial({
            color:
              Math.random()>.35
              ?0x9fd8ed
              :0x27333b
          })
        );

      win.position.set(
        x+xx,
        y,
        z-d/2-.05
      );

      scene.add(win);
    }
  }
}

for(
  let x=-400;
  x<=400;
  x+=55
){

  for(
    let z=-400;
    z<=400;
    z+=55
  ){

    const nearRoadX=
      Math.abs(x%110)<28;

    const nearRoadZ=
      Math.abs(z%110)<28;

    if(
      Math.abs(x)<45 ||
      Math.abs(z)<45 ||
      nearRoadX ||
      nearRoadZ
    ) continue;

    if(Math.random()<.78){

      makeBuilding(
        x+(Math.random()*8-4),
        z+(Math.random()*8-4),
        28+Math.random()*20,
        28+Math.random()*20,
        12+Math.random()*55
      );
    }
  }
}


/* TREES */

function tree(x,z){

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .8,1,5,8
      ),
      new THREE.MeshStandardMaterial({
        color:0x65462c
      })
    );

  trunk.position.set(
    x,2.5,z
  );

  trunk.castShadow=true;

  scene.add(trunk);

  const crown =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        4.5,10,8
      ),
      new THREE.MeshStandardMaterial({
        color:0x276b32
      })
    );

  crown.position.set(
    x,7,z
  );

  crown.castShadow=true;

  scene.add(crown);
}

for(let i=0;i<130;i++){

  const x=
    (Math.random()-.5)*850;

  const z=
    (Math.random()-.5)*850;

  if(
    Math.abs(x)<25 ||
    Math.abs(z)<25
  ) continue;

  tree(x,z);
}


/* STREET LIGHTS */

const lamps=[];

function lamp(x,z){

  const pole =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .12,.18,7,8
      ),
      new THREE.MeshStandardMaterial({
        color:0x33383d
      })
    );

  pole.position.set(
    x,3.5,z
  );

  scene.add(pole);

  const bulb =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .35,8,8
      ),
      new THREE.MeshBasicMaterial({
        color:0xffffcc
      })
    );

  bulb.position.set(
    x,7,z
  );

  scene.add(bulb);

  const light =
    new THREE.PointLight(
      0xffe9ad,
      0,
      30
    );

  light.position.set(
    x,7,z
  );

  scene.add(light);

  lamps.push(light);
}

for(
  let x=-400;
  x<=400;
  x+=55
){
  lamp(x,17);
  lamp(x,-17);
}

for(
  let z=-400;
  z<=400;
  z+=55
){
  lamp(17,z);
  lamp(-17,z);
}


/* PLAYER */

const player =
  new THREE.Group();

const body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1.5,2.4,.8
    ),
    new THREE.MeshStandardMaterial({
      color:0x2369d1
    })
  );

body.position.y=1.2;
body.castShadow=true;

player.add(body);

const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .55,12,10
    ),
    new THREE.MeshStandardMaterial({
      color:0x8a542f
    })
  );

head.position.y=2.8;

player.add(head);

player.position.set(
  0,0,80
);

scene.add(player);


/* VEHICLE TYPES */

const vehicleTypes={

  City:{
    price:5000,
    max:22,
    accel:.075,
    brake:.16,
    handling:.035,
    fuel:.8
  },

  Sport:{
    price:45000,
    max:35,
    accel:.11,
    brake:.19,
    handling:.042,
    fuel:.65
  },

  Luxury:{
    price:120000,
    max:30,
    accel:.09,
    brake:.18,
    handling:.032,
    fuel:.7
  },

  Super:{
    price:250000,
    max:45,
    accel:.15,
    brake:.23,
    handling:.052,
    fuel:.55
  },

  Hyper:{
    price:500000,
    max:55,
    accel:.18,
    brake:.26,
    handling:.06,
    fuel:.48
  }
};

let vehicles=[];


/* CAR CREATION */

function makeCar(
  type,
  x,
  z,
  color
){

  const data=
    vehicleTypes[type];

  const car =
    new THREE.Group();

  car.userData={
    type:type,
    speed:0,
    fuel:100,
    occupied:false,
    owned:false,
    traffic:false,
    headlights:[],
    data:data,
    wheels:[]
  };

  const base =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        type==="Hyper"?5.4:4.6,
        .9,
        type==="Hyper"?2.6:2.2
      ),
      new THREE.MeshStandardMaterial({
        color:color,
        metalness:.25,
        roughness:.35
      })
    );

  base.position.y=.85;
  base.castShadow=true;

  car.add(base);

  const roof =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        type==="Hyper"?2.8:2.5,
        .65,1.8
      ),
      new THREE.MeshStandardMaterial({
        color:0x17191d,
        metalness:.3,
        roughness:.25
      })
    );

  roof.position.y=1.45;

  car.add(roof);

  const wheelGeo =
    new THREE.CylinderGeometry(
      .48,.48,.35,12
    );

  const wheelMat =
    new THREE.MeshStandardMaterial({
      color:0x111111
    });

  const wheelPos=[
    [-1.6,.5,-1.05],
    [1.6,.5,-1.05],
    [-1.6,.5,1.05],
    [1.6,.5,1.05]
  ];

  for(const p of wheelPos){

    const wheel =
      new THREE.Mesh(
        wheelGeo,
        wheelMat
      );

    wheel.rotation.z=
      Math.PI/2;

    wheel.position.set(
      p[0],p[1],p[2]
    );

    wheel.castShadow=true;

    car.add(wheel);

    car.userData.wheels.push(
      wheel
    );
  }

  for(
    const sx of [-1.45,1.45]
  ){

    const headlight =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .4,.18,.12
        ),
        new THREE.MeshBasicMaterial({
          color:0xffffdd
        })
      );

    headlight.position.set(
      sx,.85,-1.12
    );

    car.add(headlight);

    const spot =
      new THREE.SpotLight(
        0xffffdd,
        0,
        35,
        .35,
        .6
      );

    spot.position.set(
      sx,1,-1.15
    );

    spot.target.position.set(
      sx,.8,-12
    );

    car.add(spot);
    car.add(spot.target);

    car.userData.headlights.push(
      spot
    );
  }

  car.position.set(
    x,0,z
  );

  scene.add(car);

  vehicles.push(car);

  return car;
}


/* PARKED CARS */

makeCar(
  "City",
  -55,
55,
0x777777
);

makeCar(
  "Sport",
  -65,
55,
0xb62d35
);

makeCar(
  "Luxury",
  -75,
55,
0x263f9c
);

makeCar(
  "Super",
  -85,
55,
0xe5e5e5
);

makeCar(
  "Hyper",
  -95,
55,
0x21a98c
);


/* =========================================================
   TRAFFIC
========================================================= */

const traffic=[];

for(let i=0;i<18;i++){

  const horizontal=
    Math.random()>0.5;

  const type=
    ["City","Sport","Luxury"][
      Math.floor(Math.random()*3)
    ];

  const car=makeCar(
    type,

    horizontal
      ? (Math.random()-.5)*750
      : (Math.random()>0.5?17:-17),

    horizontal
      ? (Math.random()>0.5?17:-17)
      : (Math.random()-.5)*750,

    new THREE.Color().setHSL(
      Math.random(),
      .65,
      .45
    )
  );

  car.userData.traffic=true;

  car.userData.speed=
    7+Math.random()*8;

  car.userData.horizontal=
    horizontal;

  traffic.push(car);
}


/* =========================================================
   HELICOPTER
========================================================= */

const helicopter=
  new THREE.Group();

const heliBody=
  new THREE.Mesh(
    new THREE.BoxGeometry(
      7,2.2,3
    ),

    })
  );

heliBody.position.y=3;

  );

tail.position.set(

);

helicopter.add(

);

helicopter.position.set(

);

scene.add(
  helicopter
);


/* =========================================================
   NPCs
========================================================= */

const npcs=[];

function makeNPC(x,z){

  const npc=
    new THREE.Group();

  const torso=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .35,.42,1.4,8
      ),

          )
      })

for(let i=0;i<40;i++){

  makeNPC(
    (Math.random()-.5)*650,
    (Math.random()-.5)*650
  );
}


/* =========================================================
   DEALERSHIP
========================================================= */

const dealership=
  new THREE.Group();

const dealerBody=
  new THREE.Mesh(
    new THREE.BoxGeometry(
      50,18,35
    ),
    new THREE.MeshStandardMaterial({
      color:0x202832
    })
  );

dealerBody.position.y=9;

dealerBody.castShadow=true;

dealership.add(

);

const sign=
  new THREE.Mesh(

    ),

    })
  );

sign.position.set(

);

dealership.add(

);

dealership.position.set(

);

scene.add(
  dealership
);


/* =========================================================
   GAME STATE
========================================================= */

let money=5000;
let health=100;
let energy=100;
let reputation=0;
let wanted=0;

let currentVehicle=null;

let mission=0;

const missions=[
  "Go to FAISAL MOTORS",
  "Buy your first vehicle",
  "Earn ₵50,000",
  "Buy the Supercar",
  "Buy the Hypercar",
  "Own a Helicopter",
  "Explore Faisal City"
];

let owned=[];


/* =========================================================
   INPUT
========================================================= */

const keys={
  up:false,
  down:false,
  left:false,
  right:false,
  brake:false
};

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="w"||
      e.key==="ArrowUp"
    )
      keys.up=true;

    if(
      e.key==="s"||
      e.key==="ArrowDown"
    )
      keys.down=true;

    if(
      e.key==="a"||
      e.key==="ArrowLeft"
    )
      keys.left=true;

    if(
      e.key==="d"||
      e.key==="ArrowRight"
    )
      keys.right=true;

    if(e.key===" ")
      keys.brake=true;

    if(e.key==="e")
      enterVehicle();

    if(e.key==="f")
      doAction();
  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="w"||
      e.key==="ArrowUp"
    )
      keys.up=false;

    if(
      e.key==="s"||
      e.key==="ArrowDown"
    )
      keys.down=false;

    if(
      e.key==="a"||
      e.key==="ArrowLeft"
    )
      keys.left=false;

    if(
      e.key==="d"||
      e.key==="ArrowRight"
    )
      keys.right=false;

    if(e.key===" ")
      keys.brake=false;
  }
);


/* MOBILE CONTROLS */

function bind(id,key){

  const el=
    document.getElementById(id);

  const start=e=>{
    e.preventDefault();
    keys[key]=true;
  };

  const end=e=>{
    e.preventDefault();
    keys[key]=false;
  };

  el.addEventListener(
    "touchstart",
    start,
    {passive:false}
  );

  el.addEventListener(
    "touchend",
    end,
    {passive:false}
  );

  el.addEventListener(
    "touchcancel",
    end,
    {passive:false}
  );

  el.addEventListener(
    "mousedown",
    start
  );

  el.addEventListener(
    "mouseup",
    end
  );

  el.addEventListener(
    "mouseleave",
    end
  );
}

bind("up","up");
bind("down","down");
bind("left","left");
bind("right","right");
bind("brake","brake");

/* =========================================================
   COLLISION
========================================================= */

function blocked(x,z){

  if(
    x<-435 ||
    x>435 ||
    z<-435 ||
    z>435
  )
    return true;

  for(
    const b of buildings
  ){

    const pad=2;

    if(
      x>b.x-b.w/2-pad &&
      x<b.x+b.w/2+pad &&
      z>b.z-b.d/2-pad &&
      z<b.z+b.d/2+pad
    ){

      return true;
    }
  }

  return false;
}


/* =========================================================
   FIND VEHICLE
========================================================= */

function closestVehicle(){

  let best=null;
  let dist=Infinity;

  for(
    const v of vehicles
  ){

    if(
      v.userData.traffic
    )
      continue;

    const d=
      v.position.distanceTo(
        player.position
      );

    if(d<dist){

      dist=d;
      best=v;
    }
  }

  return dist<8
    ?best
    :null;
}


/* =========================================================
   ENTER / EXIT VEHICLE
========================================================= */

function enterVehicle(){

  if(currentVehicle){

    currentVehicle.userData.occupied=
      false;

    currentVehicle.userData.speed=
      0;

    player.visible=true;

    player.position.copy(
      currentVehicle.position
    );

    player.position.x+=4;

    currentVehicle=null;

    showMessage(
      "You left the vehicle"
    );

    return;
  }

  const car=
    closestVehicle();

  if(!car){

    showMessage(
      "Move closer to a vehicle"
    );

    return;
  }

  if(
    car.userData.type &&
    !car.userData.owned
  ){

    showMessage(
      "This vehicle is not yours. Buy it at FAISAL MOTORS."
    );

    return;
  }

  currentVehicle=
    car;

  car.userData.occupied=
    true;

  player.visible=false;

  showMessage(
    "Driving "+
    car.userData.type
  );
}


/* =========================================================
   DRIVING
========================================================= */

function driveCar(car,dt){

  const d=
    car.userData.data;

  let speed=
    car.userData.speed;

  if(
    car.userData.fuel<=0
  ){

    speed*=.96;

  }else{

    if(keys.up){

      speed+=
        d.accel*
        dt*
        60;

      car.userData.fuel-=
        .006*
        d.fuel*
        dt*
        60;
    }

    if(keys.down){

      speed-=
        d.accel*
        .8*
        dt*
        60;
    }

    if(keys.brake){

      if(speed>0){

        speed-=
          d.brake*
          dt*
          60;

      }else{

        speed-=
          d.brake*
          .5*
          dt*
          60;
      }
    }
  }

  if(
    !keys.up &&
    !keys.down
  ){

    speed*=
      Math.pow(
        .94,
        dt*60
      );
  }

  speed=
    Math.max(
      -d.max*.35,
      Math.min(
        d.max,
        speed
      )
    );

  if(
    Math.abs(speed)>.4
  ){

    const direction=
      speed>=0
      ?1
      :-1;

    let steer=0;

    if(keys.left)
      steer+=1;

    if(keys.right)
      steer-=1;

    car.rotation.y+=
      steer*
      d.handling*
      direction*
      Math.min(
        Math.abs(speed)/10,
        1
      )*
      dt*
      60;
  }

  const forward=
    new THREE.Vector3(
      Math.sin(
        car.rotation.y
      ),
      0,
      Math.cos(
        car.rotation.y
      )
    );

  const old=
    car.position.clone();

  car.position.addScaledVector(
    forward,
    speed*dt
  );

  if(
    blocked(
      car.position.x,
      car.position.z
    )
  ){

    car.position.copy(
      old
    );

    speed*=-.25;

    if(
      Math.abs(speed)>3
    ){

      health-=.3;

      wanted=
        Math.min(
          5,
          wanted+.02
        );
    }
  }

  car.userData.speed=
    speed;

  for(
    const w of
    car.userData.wheels
  ){

    w.rotation.x-=
      speed*
      dt*
      2;
  }

  const night=
    sun.intensity<.7;

  for(
    const h of
    car.userData.headlights
  ){

    h.intensity=
      night &&
      car.userData.occupied
      ?3
      :0;
  }

  player.position.copy(
    car.position
  );

  player.position.y=0;

  if(
    Math.abs(speed)>30
  ){

    wanted=
      Math.min(
        5,
        wanted+
        .0007*
        dt*
        60
      );
  }
}


/* =========================================================
   TRAFFIC UPDATE
========================================================= */

function updateTraffic(dt){

  for(
    const car of traffic
  ){

    const s=
      car.userData.speed;

    if(
      car.userData.horizontal
    ){

      car.position.x+=
        s*
        dt*
        (
          car.position.z>0
          ?1
          :-1
        );

      car.rotation.y=
        car.position.z>0
        ?Math.PI/2
        :-Math.PI/2;

      if(
        car.position.x>440
      )
        car.position.x=-440;

      if(
        car.position.x<-440
      )
        car.position.x=440;

    }else{

      car.position.z+=
        s*
        dt*
        (
          car.position.x>0
          ?1
          :-1
        );

      car.rotation.y=
        car.position.x>0
        ?0
        :Math.PI;

      if(
        car.position.z>440
      )
        car.position.z=-440;

      if(
        car.position.z<-440
      )
        car.position.z=440;
    }
  }
}


/* =========================================================
   NPC UPDATE
========================================================= */

function updateNPCs(dt){

  for(
    const npc of npcs
  ){

    npc.userData.timer-=dt;

    if(
      !npc.userData.target ||
      npc.userData.timer<=0
    ){

      npc.userData.target=
        new THREE.Vector3(
          npc.position.x+
          (Math.random()-.5)*60,
          0,
          npc.position.z+
          (Math.random()-.5)*60
        );

      npc.userData.timer=
        3+
        Math.random()*7;
    }

    const target=
      npc.userData.target;

    const dx=
      target.x-
      npc.position.x;

    const dz=
      target.z-
      npc.position.z;

    const dist=
      Math.hypot(dx,dz);

    if(dist>.5){

      npc.position.x+=
        dx/dist*
        1.2*
        dt;

      npc.position.z+=
        dz/dist*
        1.2*
        dt;

      npc.rotation.y=
        Math.atan2(
          dx,
          dz
        );
    }
  }
}

function updatePolice(dt){

  for(
    const p of police
  ){

    if(wanted<=0)
      continue;

    const target=
      currentVehicle ||
      player;

    const dx=
      target.position.x-
      p.position.x;

    const dz=
      target.position.z-
      p.position.z;

    const dist=
      Math.hypot(dx,dz);

    if(dist<150){

      p.rotation.y=
        Math.atan2(
          dx,
          dz
        );

      p.position.x+=
        Math.sin(
          p.rotation.y
        )*
        8*
        dt;

      p.position.z+=
        Math.cos(
          p.rotation.y
        )*
        8*
        dt;

      if(dist<7){

        health-=
          .15*
          dt*
          60;

        showMessage(
          "Police are after you!"
        );
      }

    }else{

      p.position.x+=
        (Math.random()-.5)*
        dt*
        2;

      p.position.z+=
        (Math.random()-.5)*
        dt*
        2;
    }
  }

  if(wanted>0){

    wanted-=
      .003*
      dt*
      60;

    if(wanted<0)
      wanted=0;
  }
}

/* BUY VEHICLE */

function buyVehicle(type){

  const price=
    vehicleTypes[type].price;

  if(money<price){

    showMessage(
      "Not enough money."
    );

    return;
  }

  money-=price;

  owned.push(
    type
  );

  const car=
    vehicles.find(
      v=>
        v.userData.type===type &&
        !v.userData.traffic &&
        !v.userData.owned
    );

  if(car){

    car.userData.owned=
      true;
  }

  showMessage(
    "You bought the "+
    type+"!"
  );

  renderDealer();

  updateMission();
}


/* BUY HELICOPTER */

function buyHelicopter(){

  if(
    money<750000
  ){

    showMessage(
      "You need ₵750,000."
    );

    return;
  }

  money-=750000;

  owned.push(
    "Helicopter"
  );

  showMessage(
    "🚁 Helicopter purchased!"
  );

  renderDealer();

  updateMission();
}


/* =========================================================
   MISSIONS
========================================================= */

function updateMission(){

  if(mission===0){

    if(
      player.position.distanceTo(
        dealership.position
      )<35
    ){

      mission=1;
    }

  }else if(mission===1){

    if(
      owned.length>0
    ){

      mission=2;
      reputation+=10;
    }

  }else if(mission===2){

    if(
      money>=50000
    ){

      mission=3;
      reputation+=20;
    }

  }else if(mission===3){

    if(
      owned.includes(
        "Super"
      )
    ){

      mission=4;
      reputation+=30;
    }

  }else if(mission===4){

    if(
      owned.includes(
        "Hyper"
      )
    ){

      mission=5;
      reputation+=40;
    }

  }else if(mission===5){

    if(
      owned.includes(
        "Helicopter"
      )
    ){

      mission=6;
      reputation+=50;
    }
  }

  document.getElementById(
    "missionText"
  ).textContent=
    missions[mission];
}

function saveGame(){

  localStorage.setItem(
    "faisalCitySave",
    JSON.stringify({
      money:money,
      health:health,
      energy:energy,
      reputation:reputation,
      wanted:wanted,
      mission:mission,
      owned:owned
    })
  );

  showMessage(
    "💾 Game saved!"
  );
}

function loadGame(){

  const raw=
    localStorage.getItem(
      "faisalCitySave"
    );

  if(!raw)
    return;

  try{

    const s=
      JSON.parse(raw);

    money=
      s.money ?? money;

    health=
      s.health ?? health;

    energy=
      s.energy ?? energy;

    reputation=
      s.reputation ??
      reputation;

    wanted=
      s.wanted ?? wanted;

    mission=
      s.mission ?? mission;

    owned=
      s.owned ?? [];

    for(
      const v of vehicles
    ){

      if(
        owned.includes(
          v.userData.type
        ) &&
        !v.userData.traffic
      ){

        v.userData.owned=
          true;
      }
    }

  }catch(e){}
}

   CAMERA
========================================================= */

const camTarget=
  new THREE.Vector3();

function updateCamera(dt){

  const target=
    currentVehicle ||
    player;

  const distance=
    currentVehicle
    ?13
    :8;

  const height=
    currentVehicle
    ?7
    :5;

  const angle=
    target.rotation.y;

  const desired=
    new THREE.Vector3(
      target.position.x-
      Math.sin(angle)*
      distance,

      target.position.y+
      height,

      target.position.z-
      Math.cos(angle)*
      distance
    );

  camera.position.lerp(
    desired,
    Math.min(
      1,
      dt*5
    )
  );

  camTarget.lerp(
    new THREE.Vector3(
      target.position.x,
      target.position.y+1.5,
      target.position.z
    ),
    Math.min(
      1,
      dt*7
    )
  );

  camera.lookAt(
    camTarget
  );
}


/* =========================================================
   DAY / NIGHT
========================================================= */

let gameTime=
  8*60;

function updateTime(dt){

  gameTime+=
    dt*3;

  if(
    gameTime>=24*60
  )
    gameTime=0;

  const hour=
    Math.floor(
      gameTime/60
    );

  const minute=
    Math.floor(
      gameTime%60
    );

  document.getElementById(
    "clock"
  ).textContent=
    String(hour)
      .padStart(2,"0")+
    ":"+
    String(minute)
      .padStart(2,"0");

  const daylight=
    Math.max(
      0,
      Math.sin(
        ((gameTime-360)/1440)*
        Math.PI*2
      )
    );

  sun.intensity=
    .25+
    daylight*2;

  hemi.intensity=
    .35+
    daylight*1.5;

  const sky=
    new THREE.Color();

  sky.setHSL(
    .58,
    .5,
    .12+
    daylight*.42
  );

  scene.background=
    sky;

  scene.fog.color.copy(
    sky
  );

  for(
    const l of lamps
  ){

    l.intensity=
      daylight<.25
      ?1.5
      :0;
  }
}


/* =========================================================
   MINI MAP
========================================================= */

const mini=
  document.getElementById(
    "mini"
  );

const ctx=
  mini.getContext("2d");

function drawMini(){

  const w=mini.width;
  const h=mini.height;

  ctx.clearRect(
    0,0,w,h
  );

  ctx.fillStyle=
    "#1c241b";

  ctx.fillRect(
    0,0,w,h
  );

  ctx.strokeStyle=
    "#555";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(
    w/2,0
  );

  ctx.lineTo(
    w/2,h
  );

  ctx.moveTo(
    0,h/2
  );

  ctx.lineTo(
    w,h/2
  );

  ctx.stroke();

  const scale=.12;

  function dot(
    x,z,size
  ){

    const px=
      w/2+
      (x-player.position.x)*
      scale;

    const pz=
      h/2+
      (z-player.position.z)*
      scale;

    if(
      px<0 ||
      px>w ||
      pz<0 ||
      pz>h
    )
      return;

    ctx.fillRect(
      px-size/2,
      pz-size/2,
      size,
      size
    );
  }

  ctx.fillStyle=
    "#ffffff";

  for(
    const v of traffic
  ){

    dot(
      v.position.x,
      v.position.z,
      3
    );
  }

  ctx.fillStyle=
    "#ffcc33";

  dot(
    dealership.position.x,
    dealership.position.z,
    7
  );

  ctx.fillStyle=
    "#44aaff";

  dot(
    player.position.x,
    player.position.z,
    7
  );
}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(dt){

  if(currentVehicle)
    return;

  let dx=0;
  let dz=0;

  if(keys.up)
    dz-=1;

  if(keys.down)
    dz+=1;

  if(keys.left)
    dx-=1;

  if(keys.right)
    dx+=1;

  if(
    dx===0 &&
    dz===0
  )
    return;

  const len=
    Math.hypot(
      dx,dz
    );

  dx/=len;
  dz/=len;

  const speed=
    keys.brake
    ?1
    :3.5;

  const old=
    player.position.clone();

  player.position.x+=
    dx*speed*dt;

  player.position.z+=
    dz*speed*dt;

  if(
    blocked(
      player.position.x,
      player.position.z
    )
  ){

    player.position.copy(
      old
    );
  }

  player.rotation.y=
    Math.atan2(
      dx,dz
    );

  energy-=
    .5*dt;

  if(energy<0)
    energy=0;

  updateMission();
}


/* =========================================================
   GAME LOOP
========================================================= */

let last=
  performance.now();

function animate(now){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      .05,
      (now-last)/1000
    );

  last=now;

  movePlayer(dt);

  if(currentVehicle){

    driveCar(
      currentVehicle,
      dt
    );
  }

  updateTraffic(dt);
  updateNPCs(dt);
  updatePolice(dt);
  updateCamera(dt);
  updateTime(dt);
  updateHUD();
  drawMini();

  rotor.rotation.y+=
    dt*12;

  if(
    owned.includes(
      "Helicopter"
    )
  ){

    helicopter.position.y=
      Math.sin(
        now*.001
      )*2;
  }

  renderer.render(
    scene,
    camera
  );
}

animate(
  performance.now()
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================================================
   START
========================================================= */

updateMission();

showMessage(
  "Welcome to FAISAL CITY"
);

</script>

</body>
</html>
